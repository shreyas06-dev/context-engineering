<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Patterns</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f3ef;
            --ink: #2d2d2d;
            --muted: #8b8680;
            --accent: #c75b39;
            --rule: rgba(45,45,45,0.12);
            --serif: 'Fraunces', 'Times New Roman', serif;
            --sans: 'Inter', system-ui, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--ink);
            font-family: var(--sans);
            font-weight: 400;
            font-size: 15px;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-container {
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }
        .brand {
            font-family: var(--serif);
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: -0.02em;
        }
        h1 {
            font-family: var(--serif);
            font-size: 32px;
            font-weight: 300;
            margin-bottom: 8px;
            text-align: center;
        }
        .subtitle {
            color: var(--muted);
            text-align: center;
            margin-bottom: 40px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            background: transparent;
            border: 1px solid var(--rule);
            border-radius: 4px;
            color: var(--ink);
            font-family: var(--sans);
            font-size: 15px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: var(--ink);
        }
        .btn {
            width: 100%;
            padding: 16px;
            background: var(--ink);
            color: var(--bg);
            border: none;
            border-radius: 999px;
            font-family: var(--sans);
            font-size: 13px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            margin-top: 10px;
        }
        .btn:hover {
            background: var(--accent);
            color: var(--bg);
            transform: translateY(-1px);
        }
        .footer-link {
            text-align: center;
            margin-top: 30px;
            font-size: 13px;
            color: var(--muted);
        }
        .footer-link a {
            color: var(--ink);
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .error-msg {
            color: #c75b39;
            font-size: 13px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="brand">Patterns®</div>
        <h1>Welcome back</h1>
        <p class="subtitle">Enter your credentials to access your library.</p>
        
        <div id="error-box" class="error-msg"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>

        <div class="footer-link">
            Don't have an account? <a href="/signup">Create one</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorBox = document.getElementById('error-box');
            const btn = e.target.querySelector('.btn');
            
            btn.textContent = 'Signing in...';
            btn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Login failed');
                }

                // Save the token!
                localStorage.setItem('token', data.access_token);
                
                // Redirect to the main patterns page
                window.location.href = '/';
            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.style.display = 'block';
                btn.textContent = 'Sign In';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
